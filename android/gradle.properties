org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Kotlin/Native: fetch the native distribution from Maven repositories instead of the
# plugin-injected ivy repo (which FAIL_ON_PROJECT_REPOS in settings.gradle.kts rejects).
kotlin.native.distribution.downloadFromMaven=true
# Apple targets are declared but not buildable on this Windows host; silence the nag.
kotlin.native.ignoreDisabledTargets=true
